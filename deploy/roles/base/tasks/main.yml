---
- name: Install base packages
  ansible.builtin.apt:
    name: "{{ base_node_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Ensure the infraforge service user exists
  ansible.builtin.user:
    name: "{{ base_node_user }}"
    shell: /bin/bash
    create_home: true
    state: present

- name: Ensure the node config directory exists
  ansible.builtin.file:
    path: /etc/infraforge
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Render node configuration
  ansible.builtin.template:
    src: node.conf.j2
    dest: /etc/infraforge/node.conf
    owner: root
    group: root
    mode: "0644"
