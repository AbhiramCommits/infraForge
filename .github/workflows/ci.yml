name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true
      - name: go vet
        run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.5.0
      - name: unit tests
        run: go test ./... -race -cover

  ansible-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ansible, ansible-lint, and collections
        run: |
          python -m pip install --upgrade pip
          pip install ansible ansible-lint docker
          ansible-galaxy collection install -r deploy/requirements.yml
      - name: ansible-lint
        run: ansible-lint deploy/
      - name: playbook syntax check
        run: ansible-playbook --syntax-check deploy/playbooks/site.yml

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true
      - name: Verify cgroups v2
        run: |
          if [ ! -f /sys/fs/cgroup/cgroup.controllers ]; then
            echo "::error::cgroup v2 unified hierarchy not mounted; integration tests require it"
            exit 1
          fi
      - name: Install ansible, docker sdk, and sshpass
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass
          python3 -m pip install --user ansible docker
          ansible-galaxy collection install -r deploy/requirements.yml
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Prewarm module cache
        run: go mod download
      - name: Integration tests
        run: sudo env HOME="$HOME" PATH="$PATH" GOCACHE=/tmp/go-cache make test-integration
      - name: Upload reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: reports/*.json
          if-no-files-found: ignore
